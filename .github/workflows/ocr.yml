name: OCR review

# Alibaba OpenCodeReview on a GitHub-hosted runner.
# - dashscope-cn only: Alibaba Cloud Model Studio (Qwen) through
#   OCR's OpenAI-compatible provider. Beijing free-quota region only.
#   The key comes only from the
#   DASHSCOPE_API_KEY repository secret and is read via api_key_cmd, never
#   written to OCR's config file. A token budget limits work but is NOT a billing cap.
#   Every review re-qualifies the identical model before examining Ascout code.
# - ollama-local: model inside the runner on 127.0.0.1, no secrets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "qualify = planted/clean model quality test; review = review an exact Ascout range"
        type: choice
        options: [qualify, review]
        default: qualify
      provider:
        description: "Inference provider"
        type: choice
        options: [dashscope-cn, ollama-local]
        default: dashscope-cn
      model:
        description: "Only qwen3-coder-plus is permitted for the protected free tier; ignored for ollama-local"
        type: string
        default: qwen3-coder-plus
      token_budget:
        description: "OCR work budget per invocation (NOT a billing guarantee; max 150000)"
        type: string
        default: "100000"
      free_quota_only_confirmed:
        description: "I verified Free Quota Only is ACTIVE for qwen3-coder-plus in Beijing (not just requested)"
        type: boolean
        default: false
      ascout_base:
        description: "review mode: full 40-hex base SHA"
        type: string
        default: ""
      ascout_head:
        description: "review mode: full 40-hex head SHA"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ocr-review
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      MODE: ${{ inputs.mode }}
      PROVIDER: ${{ inputs.provider }}
      DS_MODEL: ${{ inputs.model }}
      TOKEN_BUDGET: ${{ inputs.token_budget }}
      FREE_QUOTA_CONFIRMED: ${{ inputs.free_quota_only_confirmed }}
      ASCOUT_BASE: ${{ inputs.ascout_base }}
      ASCOUT_HEAD: ${{ inputs.ascout_head }}
      ASCOUT_REPO: https://github.com/TheHalfMoon/Ascout.git
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
      MODEL_ID_PREFIX: 0edcdef34593
      OCR_BUILD: "v1.12.13 (fabbdb2"
      OLLAMA_VERSION: v0.40.2
      OLLAMA_SHA256: 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OCR_LLM_TIMEOUT: "2400"
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          HAS_DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [ "$MODE" = review ]; then
            for v in "$ASCOUT_BASE" "$ASCOUT_HEAD"; do
              [[ "$v" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHAs must be full lowercase 40-hex"; exit 1; }
            done
          fi
          [[ "$MODE" = qualify || "$MODE" = review ]] || { echo "::error::unsupported mode"; exit 1; }
          [[ "$PROVIDER" = dashscope-cn || "$PROVIDER" = ollama-local ]] || { echo "::error::unsupported provider or paid region"; exit 1; }
          if [ "$PROVIDER" = dashscope-cn ]; then
            [ "$FREE_QUOTA_CONFIRMED" = true ] || { echo "::error::confirm ACTIVE Beijing Free Quota Only in Model Studio before dispatch; this runner cannot verify Alibaba billing settings"; exit 1; }
            [ "$DS_MODEL" = qwen3-coder-plus ] || { echo "::error::only the confirmed free-quota model qwen3-coder-plus is allowed"; exit 1; }
            [[ "$TOKEN_BUDGET" =~ ^[0-9]{5,6}$ ]] && [ "$TOKEN_BUDGET" -ge 10000 ] && [ "$TOKEN_BUDGET" -le 150000 ] || { echo "::error::token_budget must be 10000..150000"; exit 1; }
            [ "$HAS_DASHSCOPE_KEY" = true ] || { echo "::error::DASHSCOPE_API_KEY repository secret is not set"; exit 1; }
          fi
          { echo "mode=$MODE provider=$PROVIDER model=$([ "$PROVIDER" = ollama-local ] && echo "$OLLAMA_MODEL" || echo "$DS_MODEL") token_budget=$TOKEN_BUDGET"
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/{print $2}') MiB RAM"; uname -a; } | tee "$OUT/environment.txt"

      - name: Install Ollama (pinned, checksum-verified)
        if: inputs.provider == 'ollama-local'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo ollama.tar.zst "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          mkdir ollama && tar --zstd -xf ollama.tar.zst -C ollama && rm ollama.tar.zst
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"

      - name: Start Ollama on loopback and pull the model
        if: inputs.provider == 'ollama-local'
        run: |
          set -euo pipefail
          nohup ollama serve > "$OUT/ollama-serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs "http://$OLLAMA_HOST/api/version" && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL" > /dev/null
          ollama list | tee "$OUT/model.txt"
          grep -q "$MODEL_ID_PREFIX" "$OUT/model.txt" || { echo "::error::model ID mismatch"; exit 1; }
          # Same verified weights; only the CPU thread count changes (default used 2 of 4 vCPUs).
          { echo "FROM $OLLAMA_MODEL"; echo "PARAMETER num_thread $(nproc)"; } > "$RUNNER_TEMP/Modelfile"
          ollama create ocr-reviewer -f "$RUNNER_TEMP/Modelfile" > /dev/null
          ollama show ocr-reviewer --modelfile | grep -E '^(FROM|PARAMETER)' | tee -a "$OUT/model.txt"

      - name: Install pinned gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          mkdir gitleaks && tar -xzf "$f" -C gitleaks gitleaks && rm "$f"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned Alibaba OpenCodeReview
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/ocr --version | tee "$OUT/ocr-version.txt"
          grep -qF "$OCR_BUILD" "$OUT/ocr-version.txt" || { echo "::error::OCR build mismatch"; exit 1; }

      - name: Configure OCR provider
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            ollama-local)
              ocr config set provider ollama-local
              ocr config set custom_providers.ollama-local.url "http://$OLLAMA_HOST/v1"
              ocr config set custom_providers.ollama-local.protocol openai
              ocr config set custom_providers.ollama-local.api_key ollama
              ocr config set custom_providers.ollama-local.timeout_sec "$OCR_LLM_TIMEOUT"
              ocr config set model ocr-reviewer
              curl -fs "http://$OLLAMA_HOST/api/generate" -d '{"model":"ocr-reviewer","prompt":"ok","stream":false,"options":{"num_predict":1}}' > /dev/null
              ;;
            dashscope-cn)
              url=https://dashscope.aliyuncs.com/compatible-mode/v1
              ocr config set provider "$PROVIDER"
              ocr config set "custom_providers.$PROVIDER.url" "$url"
              ocr config set "custom_providers.$PROVIDER.protocol" openai
              ocr config set "custom_providers.$PROVIDER.api_key_cmd" "printenv DASHSCOPE_API_KEY"
              ocr config set "custom_providers.$PROVIDER.timeout_sec" 600
              ocr config set model "$DS_MODEL"
              ;;
          esac
          # The key must never reach the config file.
          ! grep -rqsF "$DASHSCOPE_API_KEY" "$HOME/.config" "$HOME/.ocr" 2>/dev/null || [ -z "$DASHSCOPE_API_KEY" ] || { echo "::error::API key found in OCR config"; exit 1; }
          # Connectivity smoke test only; not a review and not a gate.
          ocr llm test > "$OUT/llm-test.txt" 2>&1 || echo "llm test exit=$? (non-gating)" | tee -a "$OUT/llm-test.txt"

      # Qualification runs in BOTH modes. A review cannot bypass this gate.
      - name: Qualify model on planted and clean fixtures (mandatory)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          budget=(); [ "$PROVIDER" != ollama-local ] && budget=(--max-tokens-budget "$TOKEN_BUDGET")
          bash scripts/build-fixture.sh "$RUNNER_TEMP/fx"
          cd "$RUNNER_TEMP/fx"
          base=$(git rev-parse main); a=$(git rev-parse change-a); b=$(git rev-parse change-b)
          echo "base=$base change-a=$a change-b=$b" | tee "$OUT/fixture-shas.txt"
          qualification_start=$(date +%s)
          for run in "a:$a" "b:$b"; do
            name=${run%%:*}; head=${run#*:}
            start=$(date +%s)
            remaining=$((2700 - (start - qualification_start)))
            [ "$remaining" -gt 0 ] || { echo "::error::45-minute qualification limit exceeded"; exit 1; }
            available_kb=$(awk '$1 == "MemAvailable:" { print $2 }' /proc/meminfo)
            [ "${available_kb:-0}" -ge 1048576 ] || { echo "::error::qualification RAM safety guard triggered"; exit 1; }
            # Overall 45-minute gate; CLI timeout is a separate per-unit guard.
            timeout --signal=TERM --kill-after=10s "${remaining}s" ocr review --repo . --from "$base" --to "$head" --format json --audience agent \
              --concurrency 1 --timeout 150 "${budget[@]}" --output "$OUT/qual-$name.json" 2> "$OUT/qual-$name.stderr.txt"
            echo "qual-$name wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/timings.txt"
          done
          [ $(( $(date +%s) - qualification_start )) -le 2700 ] || { echo "::error::45-minute qualification limit exceeded"; exit 1; }
          python3 -I "$GITHUB_WORKSPACE/harness/score.py" "$GITHUB_WORKSPACE/harness/ground-truth.json" \
            "$OUT/qual-a.json" "$OUT/qual-b.json" | tee "$OUT/score.json"
          { echo '## OCR model qualification'; echo '```json'; cat "$OUT/score.json"; echo '```'; cat "$OUT/timings.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Review exact Ascout range
        if: inputs.mode == 'review'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          budget=(); [ "$PROVIDER" != ollama-local ] && budget=(--max-tokens-budget "$TOKEN_BUDGET")
          git clone -q --filter=blob:none "$ASCOUT_REPO" "$RUNNER_TEMP/ascout"
          cd "$RUNNER_TEMP/ascout"
          git cat-file -e "$ASCOUT_HEAD^{commit}" 2>/dev/null || git fetch -q origin "$ASCOUT_HEAD"
          git cat-file -e "$ASCOUT_BASE^{commit}" 2>/dev/null || git fetch -q origin "$ASCOUT_BASE"
          git merge-base --is-ancestor "$ASCOUT_BASE" "$ASCOUT_HEAD" || { echo "::error::base is not an ancestor of head"; exit 1; }
          git checkout -q --detach "$ASCOUT_HEAD"
          # No reviewed content leaves the runner unless the exact range scans clean.
          gitleaks git --log-opts="$ASCOUT_BASE..$ASCOUT_HEAD" --redact --no-banner \
            --report-format json --report-path "$OUT/gitleaks.json" . || { echo "::error::gitleaks found potential secrets; review not sent"; exit 1; }
          ocr review --repo . --from "$ASCOUT_BASE" --to "$ASCOUT_HEAD" --preview 2>&1 | tee "$OUT/preview.txt"
          start=$(date +%s)
          ocr review --repo . --from "$ASCOUT_BASE" --to "$ASCOUT_HEAD" --format json --audience agent \
            --concurrency 1 --timeout 300 "${budget[@]}" --output "$OUT/review.json" 2> "$OUT/review.stderr.txt"
          echo "review wall_seconds=$(( $(date +%s) - start ))" | tee "$OUT/timings.txt"
          python3 -I "$GITHUB_WORKSPACE/harness/check-review.py" "$OUT/review.json" "$ASCOUT_BASE" "$ASCOUT_HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record resource use
        if: always()
        run: |
          { free -m; ollama ps 2>/dev/null || true; } > "$OUT/resources.txt" 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ocr-${{ inputs.mode }}-${{ inputs.provider }}-${{ github.run_id }}
          path: out/
          retention-days: 90
