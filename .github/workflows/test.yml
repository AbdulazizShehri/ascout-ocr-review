name: OCR offline gate tests

on:
  pull_request:
  push:
    branches: [main, fix/fail-closed-qwen-free-qualification]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile gate scripts
        run: python3 -m py_compile harness/score.py harness/check-review.py tests/test_gates.py
      - name: Run fail-closed regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
